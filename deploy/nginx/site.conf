# brawlock dedicated game server: the only nginx file brawlock owns.
# Rendered by deploy/deploy.sh --setup (__DOMAIN__, __PORT__); certbot --nginx adds TLS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # HTTP API: /health, /rooms
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the client address as nginx saw it (not a client-supplied header)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # game rooms: WebSocket at /ws?room=CODE
    location = /ws {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        tcp_nodelay on;
    }
}
