# First-party app. Install only after the matching app package and auth are ready.
# Region API/WS remains at us.brawlock.osc.link and eu.brawlock.osc.link.
server {
    listen 80;
    listen [::]:80;
    server_name brawlock.osc.link;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brawlock.osc.link;
    ssl_certificate /etc/letsencrypt/live/brawlock.osc.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brawlock.osc.link/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/brawlock/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/ {
        # OAuth callback query strings contain one-use authorization codes.
        access_log off;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:5352;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        add_header Cache-Control no-store always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache;
    }
}
