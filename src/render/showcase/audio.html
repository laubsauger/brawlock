<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>brawlock showcase soundtrack</title>
    <script>
      // same seeded Math.random as the capture page, so render-side randomness matches
      ;(function () {
        var seed = 1337 >>> 0
        Math.random = function () {
          seed = (seed + 0x6d2b79f5) >>> 0
          var t = seed
          t = Math.imul(t ^ (t >>> 15), t | 1)
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
      })()
    </script>
  </head>
  <body>
    <script type="module" src="./audioPage.ts"></script>
  </body>
</html>
