<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>brawlock sound board</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #120d0b;
        --panel: #1d1512;
        --line: #3a2a22;
        --text: #f3e4cf;
        --dim: #a8927c;
        --accent: #ff8a3d;
        --ok: #7fd68a;
        --warn: #ffcc66;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: #1a120f; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0 12px 0 0; font-size: 18px; }
      header label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
      input[type='search'] { min-width: 220px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
      button { cursor: pointer; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
      button:hover { border-color: var(--accent); }
      button[aria-pressed='true'] { background: var(--accent); color: #1a0f08; border-color: var(--accent); }
      main { padding: 8px 16px 48px; max-width: 1200px; }
      section h2 { margin: 24px 0 8px; font-size: 15px; color: var(--accent); }
      .row { display: grid; grid-template-columns: 60px minmax(180px, 1.2fr) minmax(160px, 1fr) 150px; gap: 10px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #241a15; }
      .row:hover { background: #1a1310; }
      .name { overflow-wrap: anywhere; }
      .meta { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
      .note { color: var(--warn); }
      .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .controls input[type='number'] { width: 64px; padding: 3px 4px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
      .meter { position: relative; height: 10px; background: #2a1e18; border-radius: 3px; overflow: hidden; }
      .meter > div { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--ok), var(--warn) 80%, #ff5a4a); }
      .meterText { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
      @media (max-width: 760px) { .row { grid-template-columns: 52px 1fr; } .row > :nth-child(n + 3) { grid-column: 2; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./soundboard.tsx"></script>
  </body>
</html>
